[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remindme"
version = "1.0.0"
description = "RemindMe - natural-language reminder agent (spec 001-reminder-agent)"
requires-python = ">=3.12"
dependencies = ["anthropic>=0.80"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "jsonschema>=4"]

[project.scripts]
remindme = "remindme.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
