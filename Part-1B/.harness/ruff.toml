# Lint gate configuration (constitution: Engineering Constraints). Owned by the harness;
# the coding agent must not edit this file (enforced by the integrity gate).
line-length = 100
target-version = "py312"

[lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes (unused imports/variables, undefined names)
  "I",   # import sorting
  "B",   # flake8-bugbear (likely bugs)
  "UP",  # pyupgrade
  "SIM", # simplifications
  "C90", # mccabe complexity
  "PL",  # pylint subset
]
ignore = ["PLR2004"]  # magic values are fine in exit codes / limits defined by the spec

[lint.mccabe]
max-complexity = 10

[lint.pylint]
max-args = 6
max-branches = 12

[lint.per-file-ignores]
"tests/**" = ["PLR0913", "PLC0415"]
".harness/run_eval.py" = ["PLC0415"]  # lazy imports so --replay works without src

[lint.isort]
known-first-party = ["remindme", "tests", "evaluators"]
